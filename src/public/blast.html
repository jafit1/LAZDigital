<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2704F">
  <title>Broadcast — LAZ Digital</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📣</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <!-- Gaya yang sama persis dengan halaman utama, bukan salinan yang mirip.
       Satu berkas untuk dua halaman berarti perubahan tema di LAZDigital ikut
       berlaku di sini tanpa ada yang perlu diingat. -->
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/utils/qrcode.js" defer></script>
</head>
<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <canvas id="bgfx" aria-hidden="true"></canvas>
  <div class="ag-grid"></div>
  <script>
    /* Tema dibaca dari kunci yang sama dengan halaman utama, supaya berpindah
       halaman tidak menyalakan lampu terang di tengah malam. */
    document.documentElement.setAttribute('data-theme', localStorage.getItem('laz_theme') || 'light');
  </script>

  <!-- ============ LOADING ============ -->
  <!-- Tulisannya delapan keping karena hurufnya datang berurutan; kepingnya
       hanya jendela ke satu masker yang sama, bukan delapan gambar. -->
  <div id="boot" class="lz lz--full" role="status" aria-live="polite" aria-label="Memuat">
    <div class="lz-mark">
      <div class="lz-flower" role="img" aria-label="Lazismu"></div>
      <div class="lz-word" role="img" aria-label="lazismu">
        <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
      </div>
      <div class="lz-bantul" role="img" aria-label="Bantul"></div>
    </div>
    <div class="lz-line"><i></i></div>
    <div class="lz-lama" id="bootLama"></div>
  </div>

  <!-- Selubung saat berpindah halaman. Hanya bunganya — penanda sedang sibuk
       tidak perlu lambang lengkap, dan lambang lengkap yang berkedip tiap kali
       pindah menu justru melelahkan. -->
  <div id="sibuk" class="lz lz--sibuk" aria-hidden="true">
    <div class="lz-mark"><div class="lz-flower"></div></div>
    <div class="lz-line"><i></i></div>
  </div>

  <!-- ============ APP ============ -->
  <div id="appView" class="app hidden">
    <header class="topnav" id="topnav">
      <div class="tn-brand" id="brandBox">
        <button class="tn-brand-id" type="button" onclick="toggleSidebar()" title="Klik untuk membuka / menutup menu" aria-label="Buka atau tutup menu">
          <span class="logo">LZ</span>
        </button>
      </div>
      <nav class="tn-nav" id="nav"></nav>
      <div class="tn-right">
        <span class="badge" id="lencanaDriver" title="Cara pesan dikirim"></span>
        <!-- Kartu akun bisa ditekan: pengaturan akun dibuka di sini, tanpa
             harus kembali dulu ke LAZDigital lalu mencari jalan balik. -->
        <button class="user-chip" id="chipPengguna" type="button" title="Pengaturan akun" aria-label="Pengaturan akun">
          <div class="avatar" id="uAvatar">A</div>
          <div class="uc-meta">
            <div id="uName" class="uc-name"></div>
            <div id="uRole" class="muted uc-role"></div>
          </div>
        </button>
        <!-- Ikon + label, pola yang sama dengan sidebar LAZDigital: labelnya
             disembunyikan sendiri oleh styles.css saat menu diciutkan.
             Tombol tema TIDAK lagi di sini — ia pindah ke pojok kanan atas,
             sebaris dengan judul halaman. -->
        <button class="tn-icon" id="tombolKembali" type="button" title="Kembali ke LAZDigital" aria-label="Kembali ke LAZDigital">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 19 3.5 12 10 5"/><path d="M3.5 12H20"/></svg>
          <span>Kembali ke LAZDigital</span>
        </button>
      </div>
    </header>
    <main class="main"><div id="isi"></div></main>
  </div>

  <!-- ============ MODAL ROOT ============ -->
  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modalCard">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="close-x" onclick="tutupModal()">&times;</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- lz-ui.js memuat penyelaras <select> dan pemilih tanggal yang sama dengan
       halaman utama, supaya dropdown di sini tidak tampak beda sendiri. -->
  <script src="/js/lz-ui.js" defer></script>
  <script src="/blast.js" defer></script>
</body>
</html>
