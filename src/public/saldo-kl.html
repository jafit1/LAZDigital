<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2704F">
<link rel="icon" href="/ikon/lazismu.svg" type="image/svg+xml">
<meta name="robots" content="noindex,nofollow">
<title>Saldo Kantor Layanan - LAZISMU Daerah Bantul</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="/styles.css">
<script src="/js/lz-tema.js"></script>
<script src="/js/lz-logo.js" defer></script>
<style>
  /* === halaman saldo kl — memakai token styles.css supaya tema ikut === */
  *{box-sizing:border-box}
  body{padding:0;margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       -webkit-text-size-adjust:100%;}
  .kl-wrap{max-width:1040px;margin:0 auto;padding:20px 14px 40px;}

  /* --- kepala --- */
  .kl-head{
    position:relative;overflow:hidden;
    background:var(--grad-accent);color:#fff;border-radius:18px;padding:18px 20px;
    margin-bottom:14px;box-shadow:var(--shadow);
    display:flex;align-items:center;gap:12px;
  }
  .kl-head::after{
    content:"";position:absolute;right:-60px;top:-70px;width:210px;height:210px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,255,255,.26),transparent 70%);pointer-events:none;
  }
  /* Logo Lazismu Bantul: SVG bergerak (js/lz-logo.js), sama dengan bilah menu web asli.
     Ditaruh di kepingan putih supaya tulisan logo tetap gelap dan terbaca di atas gradasi. */
  .kl-head #brandBox{
    flex:none;display:flex;align-items:center;justify-content:center;
    padding:7px 9px;border-radius:14px;background:#fff;
    box-shadow:0 6px 16px -10px rgba(0,0,0,.55);
  }
  .kl-head #brandBox .lz-logo-svg{--lz-logo-t:30px;--lzm-ink:#1b1e25 !important;--lzm-orange:#F59A1F}
  .kl-nama{font-family:var(--head);font-size:clamp(16px,2.4vw,19px);font-weight:800;line-height:1.25;letter-spacing:-.01em}
  .kl-sub{font-size:12px;opacity:.93;margin-top:2px}

  /* --- kartu --- */
  .kl-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;
           padding:16px 18px;margin-bottom:14px;box-shadow:var(--shadow)}
  .kl-label{display:flex;align-items:center;gap:8px;font-family:var(--head);font-size:13px;
            font-weight:700;color:var(--text);margin-bottom:10px}
  .kl-label .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex:none}

  /* --- form kode --- */
  .kl-form{display:flex;gap:9px;flex-wrap:wrap}
  .kl-input{
    flex:1 1 220px;min-width:0;height:46px;border:1px solid var(--border);border-radius:12px;
    background:var(--surface);color:var(--text);padding:0 13px;font-family:ui-monospace,monospace;
    font-size:16px;letter-spacing:.08em;text-transform:uppercase;outline:none;
  }
  .kl-input::placeholder{color:var(--muted);letter-spacing:.04em}
  .kl-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,112,79,.14)}
  .kl-btn{
    flex:0 0 auto;height:46px;border:0;border-radius:12px;padding:0 20px;
    background:var(--grad-accent);color:#fff;font-weight:800;font-size:13px;cursor:pointer;
    font-family:var(--sans);box-shadow:0 6px 14px -8px rgba(242,112,79,.9);transition:opacity .15s,transform .15s;
  }
  .kl-btn:hover{opacity:.94}
  .kl-btn:active{transform:translateY(1px)}
  .kl-btn:disabled{opacity:.55;cursor:default}
  .kl-error{margin-top:10px;color:var(--red);font-size:12.5px;font-weight:600}

  /* --- ringkasan: satu kartu saldo akhir + keterangan kantor --- */
  .kl-hero{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;
    margin-bottom:14px;box-shadow:var(--shadow);
    display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px 26px;
  }
  .kl-hero-main{flex:1 1 260px;min-width:0}
  .kl-hero .l{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .kl-hero .v{
    font-family:var(--head);font-size:clamp(26px,5.4vw,34px);font-weight:800;line-height:1.12;
    color:var(--green);margin-top:6px;word-break:break-word;font-variant-numeric:tabular-nums;
  }
  .kl-hero .v.minus{color:var(--red)}
  .kl-hero-meta{
    flex:0 1 240px;min-width:0;display:grid;gap:11px;
    padding-left:22px;border-left:1px solid var(--border2);
  }
  .kl-hero-meta .ml{display:block;font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .kl-hero-meta .mv{display:block;font-size:13px;font-weight:600;line-height:1.45;margin-top:2px;color:var(--text)}

  /* --- tabel --- */
  .kl-tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--border2)}
  table.kl-tbl{width:100%;border-collapse:collapse;font-size:13px;min-width:560px}
  table.kl-tbl th{
    text-align:left;color:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;padding:10px 12px;background:var(--surface2);
    border-bottom:1px solid var(--border);white-space:nowrap;
  }
  table.kl-tbl td{padding:9px 12px;border-bottom:1px solid var(--border2);white-space:nowrap}
  table.kl-tbl tbody tr:last-child td{border-bottom:0}
  table.kl-tbl tbody tr:hover{background:var(--surface3)}
  table.kl-tbl th.n,table.kl-tbl td.n{text-align:right;font-variant-numeric:tabular-nums}
  table.kl-tbl th:first-child,table.kl-tbl td:first-child{position:sticky;left:0;background:var(--surface);z-index:1}
  table.kl-tbl th:first-child{background:var(--surface2)}
  table.kl-tbl tbody tr:hover td:first-child{background:var(--surface3)}
  table.kl-tbl td.pos{font-weight:600;color:var(--text2)}
  table.kl-tbl td.akhir{font-weight:800}
  /* Baris Amil dipisahkan garis tebal + warna lembut: tempat hak amil
     berkumpul, bukan dana yang bisa dibelanjakan. */
  table.kl-tbl tbody tr.amil td{background:var(--surface2);border-top:2px solid var(--border);border-bottom:2px solid var(--border);font-weight:600}
  table.kl-tbl tbody tr.amil td:first-child{background:var(--surface2)}
  table.kl-tbl tbody tr.amil:hover td,table.kl-tbl tbody tr.amil:hover td:first-child{background:var(--surface3)}
  table.kl-tbl tfoot td{font-weight:800;border-top:2px solid var(--border);background:var(--surface)}
  table.kl-tbl tfoot td:first-child{background:var(--surface)}

  /* keterangan di bawah tabel */
  .kl-catatan{margin:12px 0 0;padding:0;list-style:none}
  .kl-catatan li{
    position:relative;padding-left:15px;margin-bottom:6px;
    font-size:11.5px;line-height:1.65;color:var(--muted);
  }
  .kl-catatan li:last-child{margin-bottom:0}
  .kl-catatan li::before{
    content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--border);
  }
  .kl-catatan b{color:var(--text2);font-weight:700}

  .kl-foot{text-align:center;color:var(--muted);font-size:11.5px;padding:16px 8px 0;line-height:1.7}
  .kl-foot b{color:var(--text)}

  @media (max-width:600px){
    .kl-wrap{padding:14px 10px 32px}
    .kl-head{padding:15px 16px;border-radius:16px}
    .kl-card{padding:14px;border-radius:14px}
    .kl-form{gap:8px}
    .kl-input,.kl-btn{height:44px;font-size:15px}
    .kl-btn{flex:1 1 100%}
    .kl-hero{padding:15px 16px;border-radius:14px;gap:14px}
    .kl-hero-meta{
      flex:1 1 100%;grid-template-columns:1fr 1fr;gap:10px 16px;
      padding-left:0;padding-top:13px;border-left:0;border-top:1px solid var(--border2);
    }
    table.kl-tbl{font-size:12px;min-width:520px}
    table.kl-tbl th,table.kl-tbl td{padding:8px 9px}
  }
  @media print{
    .kl-form,.kl-foot,.kl-head::after{display:none!important}
    body{background:#fff}
    .kl-card,.kl-hero{box-shadow:none;border-color:#ccc}
    .kl-tw{overflow:visible;border-color:#ccc}
  }
</style>
</head>
<body>
<div class="kl-wrap">
  <div class="kl-head">
    <div id="brandBox"><span class="lz-logo-svg lz-logo-tunggu" data-lz-logo role="img" aria-label="Lazismu Bantul"></span></div>
    <div>
      <div class="kl-nama">Saldo Kantor Layanan</div>
      <div class="kl-sub">LAZISMU Daerah Bantul · posisi real time</div>
    </div>
  </div>

  <div class="kl-card">
    <div class="kl-label"><span class="dot"></span> Kode akses Anda</div>
    <div class="kl-form">
      <input id="klKode" class="kl-input" placeholder="KL-XXXXXXXX" autocomplete="off"
             autocapitalize="characters" spellcheck="false" inputmode="text">
      <button id="klBtn" class="kl-btn" onclick="klCari()">Lihat Saldo</button>
    </div>
    <div id="klError" class="kl-error" style="display:none"></div>
  </div>

  <div id="klHasil"></div>

  <div class="kl-foot">Saldo mengikuti pembukuan LAZISMU Daerah Bantul.<br>Kode akses bersifat pribadi untuk masing-masing kantor.</div>
</div>

<script>
(function(){
  var input=document.getElementById('klKode');
  var simpan=localStorage.getItem('klKode');
  if(simpan) input.value=simpan;
  input.addEventListener('input',function(){this.value=this.value.toUpperCase();});
  input.addEventListener('keydown',function(e){if(e.key==='Enter')klCari();});
})();

function klRp(n){
  n=Number(n)||0;
  var s=new Intl.NumberFormat('id-ID',{maximumFractionDigits:0}).format(Math.abs(n));
  return (n<0?'−Rp':'Rp')+s;
}
function klWaktu(s){
  var d=new Date(s);
  if(isNaN(d)) return {tgl:String(s||''),jam:''};
  var zona='Asia/Jakarta';
  var tgl=new Intl.DateTimeFormat('id-ID',{day:'2-digit',month:'short',year:'numeric',timeZone:zona}).format(d);
  var jam=new Intl.DateTimeFormat('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:zona}).format(d);
  return {tgl:tgl,jam:jam.replace(/[.:]/g,':')+' WIB'};
}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

/* Layar muat & logo bergerak memakai js/lz-logo.js yang sama dengan web asli:
   logo Lazismu Bantul besar di tengah, latar diburamkan sesuai tema. Tampil
   saat halaman masuk/refresh dan setiap kali saldo dicek. */
function klMuat(tahan){
  if(!window.LZLogo) return {selesai:function(){},tutup:function(){}};
  try{ return LZLogo.muat({tahan:!!tahan}); }catch(e){ return {selesai:function(){},tutup:function(){}}; }
}
function klMulai(){
  var box=document.getElementById('brandBox');
  if(!window.LZLogo){
    /* js/lz-logo.js gagal termuat: kepala halaman jangan kosong. */
    if(box) box.innerHTML='<img src="/ikon/lazismu.svg" alt="LAZISMU" style="width:38px;height:38px;display:block">';
    return;
  }
  try{ LZLogo.periksa(); }catch(e){ /* biarkan logo tampil apa adanya */ }
  klMuat(false);
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',klMulai); else klMulai();

function klCari(){
  var kode=(document.getElementById('klKode').value||'').trim().toUpperCase();
  var err=document.getElementById('klError'), btn=document.getElementById('klBtn'), hasil=document.getElementById('klHasil');
  err.style.display='none'; hasil.innerHTML='';
  if(!kode){err.textContent='Kode akses belum diisi.';err.style.display='block';return;}
  localStorage.setItem('klKode',kode);
  btn.disabled=true; btn.textContent='Memuat...';
  var muat=klMuat(true);
  fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({fn:'apiSaldoKLPublik',args:[kode,'']})})
    .then(function(r){return r.json();})
    .then(function(j){
      if(j&&j.__error) throw new Error(j.__error);
      var d=j.result, dana=d.dana||[];
      var salur=dana.reduce(function(a,x){return a+(Number(x.salur)||0);},0);
      var waktu=klWaktu(d.diperbarui);

      /* Satu kartu ringkas: saldo akhir besar, kantor & waktu di sisi kanan
         (di HP turun jadi dua kolom kecil di bawah angka). */
      var h='<div class="kl-hero">'
        +'<div class="kl-hero-main">'
        +'<div class="l">Saldo akhir</div>'
        +'<div class="v'+(d.total<0?' minus':'')+'">'+klRp(d.total)+'</div>'
        +'</div>'
        +'<div class="kl-hero-meta">'
        +'<div><span class="ml">Kantor</span><span class="mv">'+esc(d.nama)+'</span></div>'
        +'<div><span class="ml">Diperbarui</span><span class="mv">'+esc(waktu.tgl)+(waktu.jam?' · '+esc(waktu.jam):'')+'</span></div>'
        +'</div></div>';

      h+='<div class="kl-card"><div class="kl-label"><span class="dot"></span> Rincian per jenis dana</div>'
        +'<div class="kl-tw"><table class="kl-tbl"><thead><tr>'
        +'<th>Jenis dana</th><th class="n">Saldo awal 2026</th><th class="n">Penghimpunan</th>'
        +'<th class="n">Hak amil</th><th class="n">UMP</th><th class="n">Saldo akhir</th>'
        +'</tr></thead><tbody>';

      dana.forEach(function(x){
        /* Hak amil ditulis apa adanya tanpa tanda minus: staf KL bingung
           membaca angka bersimbul. Baris Amil dipisah warna & garing sendiri
           supaya kelihatan bahwa di situlah potongan itu berkumpul. */
        var isAmil = String(x.dana)==='Amil';
        var selAmil = isAmil ? klRp(x.amilMasuk) : klRp(Math.abs(x.amil));
        h+='<tr'+(isAmil?' class="amil"':'')+'>'
          +'<td class="pos">'+esc(String(x.dana||'').replace(/_/g,' '))+'</td>'
          +'<td class="n">'+klRp(x.awal)+'</td>'
          +'<td class="n">'+klRp(x.himpun)+'</td>'
          +'<td class="n">'+selAmil+'</td>'
          +'<td class="n">'+klRp(x.sisaUmk)+'</td>'
          +'<td class="n akhir" style="color:'+(x.akhir<0?'var(--red)':'')+'">'+klRp(x.akhir)+'</td></tr>';
      });

      h+='</tbody><tfoot><tr><td>TOTAL</td>'
        +'<td class="n">'+klRp(d.pembuka)+'</td>'
        +'<td class="n">'+klRp(dana.reduce(function(a,x){return a+(Number(x.himpun)||0);},0))+'</td>'
        +'<td class="n">Rp0</td>'
        +'<td class="n">'+klRp(dana.reduce(function(a,x){return a+(Number(x.sisaUmk)||0);},0))+'</td>'
        +'<td class="n" style="color:'+(d.total<0?'var(--red)':'')+'">'+klRp(d.total)+'</td></tr></tfoot>'
        +'</table></div>';

      var butir = [
        'Hak amil dipotong dari tiap jenis dana, lalu dikumpulkan di baris <b>Amil</b> (baris berlatar abu). '
          + 'Karena hanya berpindah pos, jumlah kolom hak amil = <b>Rp0</b>.',
        'UMP adalah uang muka program yang diserahkan ke kantor. Potongannya mengikuti pilar pada pengajuan dan LPJ, '
          + 'jadi tidak menumpuk di Infak Umum. Sisa yang belum di-LPJ tetap di pos asalnya.'
      ];
      if(Math.abs(salur)>0.5){
        butir.push('Penyaluran langsung di luar uang muka: <b>'+klRp(salur)+'</b>.');
      }
      butir.push('Saldo akhir = saldo awal + penghimpunan − hak amil − UMP'
        + (Math.abs(salur)>0.5?' − penyaluran langsung':'') + '.');
      h+='<ul class="kl-catatan">'
        + butir.map(function(b){return '<li>'+b+'</li>';}).join('')
        + '</ul>';
      h+='</div>';
      hasil.innerHTML=h;
      muat.selesai();
    })
    .catch(function(e){err.textContent=(e&&e.message)||'Kode tidak dikenali.';err.style.display='block';muat.selesai();})
    .then(function(){btn.disabled=false;btn.textContent='Lihat Saldo';});
}
</script>
</body>
</html>
