<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2704F">
  <title>LAZ Digital — Lazismu Bantul</title>
  <link rel="icon" href="/ikon/lazismu.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/ikon/ikon-180.png">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Huruf: stylesheet Google Fonts tetap tidak menahan boot (media=print lalu dilepas), tetapi layar TIDAK digambar
       dengan huruf sistem dulu. Tanpa penahan, layar pertama memakai huruf sistem lalu berganti ke Inter/Plus Jakarta Sans
       di depan mata (ukuran dan bentuk huruf berubah). Isi halaman ditahan transparan sampai kedua huruf siap, paling lama 1,5 detik
       supaya server huruf yang macet tidak menahan aplikasi. -->
  <style>html.tunggu-huruf body{opacity:0}html body{transition:opacity .15s}</style>
  <script>(function(){var h=document.documentElement;h.classList.add("tunggu-huruf");var l=function(){h.classList.remove("tunggu-huruf")};window.__hurufSiap=function(){try{Promise.all([document.fonts.load("500 14px Inter"),document.fonts.load("700 14px 'Plus Jakarta Sans'")]).then(l,l)}catch(e){l()}};setTimeout(l,1500)})()</script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" media="print" onload="this.media='all';window.__hurufSiap&&window.__hurufSiap()">
  <noscript><style>html.tunggu-huruf body{opacity:1}</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"></noscript>
  <link rel="stylesheet" href="/styles.css">
  <!-- Pustaka Excel: salinan sendiri, dan async. Dulu dari cdn.sheetjs.com dengan defer, dan skrip defer berjalan berurutan:
       app.js baru mulai setelah 880 KB dari server pihak ketiga selesai diunduh, jadi layar pembuka ikut menunggu CDN yang lambat
       atau terblokir di jaringan kantor. Pustaka ini baru dipakai saat impor/ekspor Excel, bukan saat membuka aplikasi. -->
  <script src="/js/vendor/xlsx.full.min.js" async></script>
  <script src="/js/utils/qrcode.js" defer></script>
  <script src="/js/lz-perangkat.js"></script>
  <script src="/js/lz-logo.js" defer></script>
  <script src="/js/lz-sisi.js" defer></script>
</head>
<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
  <canvas id="bgfx" aria-hidden="true"></canvas>
  <div class="ag-grid"></div>
  <script>
    document.documentElement.setAttribute('data-theme',localStorage.getItem('laz_theme')||'light');
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js').catch(function(){});
      });
    }
  </script>

  <!-- ============ LOADING ============ -->
  <!-- Ditulis langsung di HTML, bukan dibuat JS, supaya sudah terlihat
       sebelum berkas JS yang besar selesai diunduh. Sembilan lapis kata yang
       sama, masing-masing hanya memperlihatkan satu pita mendatar (lihat
       bagian 37 styles.css) — jadi yang terbaca tetap satu kata. Karena isinya
       teks dan bukan gambar, tidak ada berkas yang perlu menunggu diunduh.
       Animasinya berulang tanpa batas waktu; yang menghentikannya adalah
       datanya siap, bukan hitungan detik. -->
  <div id="boot" class="lz lz--full" role="status" aria-live="polite" aria-label="Memuat">
    <div class="lz-bar" aria-hidden="true"><i></i><i></i><i></i></div>
    <div class="lz-lama" id="bootLama"></div>
  </div>

  <!-- ============ LOGIN ============ -->
  <div id="loginView" class="login-wrap hidden">
    <button type="button" class="lz-tema-pojok kepala-tema" data-lz-tema></button>
    <div class="login-card">
      <div class="login-logo"><img src="/ikon/lazismu-putih.svg" alt="Lazismu" width="40" height="40"></div>
      <h1>LAZ <span class="gradient-text">Digital</span></h1>
      <div class="sub">Sistem Pencatatan Lembaga Amil Zakat</div>
      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="field">
          <label>Username</label>
          <input id="lUser" autocomplete="username" placeholder="Masukkan username" required>
        </div>
        <div class="field">
          <label>Password</label>
          <input id="lPass" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>
        <label style="display:flex;align-items:center;gap:8px;font-size:13.5px;margin:2px 0 16px;cursor:pointer;color:var(--muted)"><input type="checkbox" id="lRemember" checked style="width:16px;height:16px;accent-color:var(--accent);cursor:pointer"> Ingat saya di perangkat ini</label>
        <button class="btn btn-primary btn-block" id="loginBtn" type="submit">Masuk</button>
      </form>
      <div id="loginErr" class="muted" style="color:var(--red);font-size:13px;margin-top:12px;text-align:center"></div>

    </div>
  </div>

  <!-- ============ APP ============ -->
  <div id="appView" class="app hidden">
    <header class="topnav" id="topnav">
      <div class="tn-brand" id="brandBox"><button class="tn-brand-id" type="button" onclick="toggleSidebar()" title="Klik untuk membuka / menutup menu" aria-label="Buka atau tutup menu"><span class="logo-img lz-logo-svg lz-logo-tunggu" data-lz-logo role="img" aria-label="Lazismu Bantul"></span></button></div>
      <nav class="tn-nav" id="nav"></nav>
      <div class="tn-right">
        <div class="user-chip" onclick="openProfile()" title="Pengaturan User">
          <div class="avatar" id="uAvatar">A</div>
          <div class="uc-meta">
            <div id="uName" class="uc-name"></div>
            <div id="uRole" class="muted uc-role"></div>
          </div>
        </div>
        <button class="tn-icon tn-keluar" onclick="doLogout()" type="button" title="Keluar dari akun" aria-label="Keluar dari akun">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5v8"/><path d="M17.5 6.4a7.5 7.5 0 1 1-11 0"/></svg>
          <span>Keluar</span>
        </button>
      </div>
    </header>
    <main class="main"><div id="content"></div></main>
  </div>

  <!-- ============ MODAL ROOT ============ -->
  <div class="modal-bg" id="modalBg">
    <div class="modal" id="modalCard">
      <div class="modal-head"><h3 id="modalTitle"></h3><button class="close-x" onclick="closeModal()">&times;</button></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- defer: dieksekusi berurutan (qrcode → app) setelah HTML selesai diparse,
       jadi parsing halaman tidak diblokir oleh library besar. -->
  <script src="/js/lz-tema.js" defer></script>
  <script src="/js/lz-kwitansi.js" defer></script>
  <script src="/app.js" defer></script>
</body>
</html>
