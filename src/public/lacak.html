<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F2704F">
  <link rel="icon" href="/ikon/surat.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/ikon/ikon-180.png">
  <meta name="robots" content="noindex">
  <title>Lacak Progres</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script src="/js/lz-tema.js"></script>
  <script src="/js/lz-perangkat.js"></script>
  <script src="/js/lz-logo.js"></script>
  <style>
    /* LACAK PENGAJUAN (pemilik, 2 Oktober 2026): pemohon bantuan, sponsorship,
       atau proposal melihat sudah sampai mana pengajuannya tanpa menelepon
       kantor. Yang tampil hanya langkah dan tanggalnya; catatan internal,
       hasil asesmen, nominal, dan nama petugas tidak pernah dikirim server. */
    body{ margin:0; padding:0; background:var(--bg); }
    .lk-wrap{ max-width:560px; margin:0 auto; padding:16px 16px 48px; }
    /* Kepala dengan logo dan nama lembaga, sama dengan link donatur. */
    .lk-atas-bar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    .lk-id{ display:flex; align-items:center; gap:10px; min-width:0; }
    .lk-logo{ width:40px; height:40px; flex:none; border-radius:12px; background:var(--accent-soft); border:1px solid var(--accent-soft2);
      display:grid; place-items:center; overflow:hidden; font-family:var(--head); font-weight:800; font-size:14px; color:var(--accent-d); }
    .lk-logo img{ width:100%; height:100%; object-fit:contain; }
    .lk-lembaga{ font-family:var(--head); font-size:15px; font-weight:700; line-height:1.2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lk-tema{ width:36px; height:36px; padding:0; flex:none; border-radius:11px; border:1px solid var(--border); background:var(--surface); color:var(--text2); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; }
    .lk-tema .lz-tema-ikon{ width:19px; height:19px; display:block; }
    .lk-head{ background:var(--grad-accent); color:#fff; border-radius:var(--radius); padding:22px 22px; box-shadow:var(--glow); position:relative; overflow:hidden; }
    .lk-head::after{ content:""; position:absolute; right:-70px; top:-90px; width:240px; height:240px; border-radius:50%; background:radial-gradient(circle,rgba(255,255,255,.22),transparent 70%); pointer-events:none; }
    .lk-head h1{ font-family:var(--head); font-size:24px; margin:0; position:relative; letter-spacing:-.01em; }
    .lk-head p{ margin:6px 0 0; opacity:.92; font-size:13.5px; position:relative; line-height:1.5; }
    .lk-form{ background:var(--glass-card); border:1px solid var(--glass-bd); box-shadow:var(--shadow); border-radius:var(--radius); padding:18px; margin-top:14px; display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr); gap:12px; }
    .lk-form.hidden{ display:none; }
    .lk-form label{ font-size:12px; font-weight:700; color:var(--text2); display:block; margin-bottom:6px; }
    .lk-form input{ width:100%; height:46px; padding:0 14px; border-radius:12px; font-size:15px; font-weight:600; letter-spacing:.02em; text-transform:uppercase; }
    .lk-form input::placeholder{ text-transform:none; font-weight:400; letter-spacing:0; }
    .lk-form button{ grid-column:1 / -1; height:46px; font-size:14.5px; border-radius:12px; }
    .lk-muat{ margin-top:14px; text-align:center; font-size:13px; color:var(--muted); padding:18px; }
    .lk-lain{ display:block; margin:12px auto 0; border:0; background:none; color:var(--accent-d); font-weight:700; font-size:13px; cursor:pointer; padding:6px 10px; }
    .lk-lain.hidden{ display:none; }
    .lk-hasil{ margin-top:16px; }
    .lk-kartu{ background:var(--glass-card); border:1px solid var(--glass-bd); box-shadow:var(--shadow); border-radius:var(--radius); padding:20px 18px; }
    .lk-atas{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; flex-wrap:wrap; }
    .lk-jenis{ font-size:11.5px; font-weight:800; color:var(--accent-d); background:var(--accent-soft); border-radius:6px; padding:2px 8px; }
    .lk-nomor{ font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums; }
    .lk-perihal{ font-family:var(--head); font-weight:800; font-size:18px; margin:8px 0 2px; color:var(--text); }
    .lk-tgl{ font-size:12.5px; color:var(--muted); }
    .lk-status{ margin:16px 0 4px; font-size:13px; color:var(--text2); }
    .lk-status b{ font-size:16px; color:var(--text); }
    .lk-langkah{ list-style:none; margin:14px 0 0; padding:0; }
    .lk-langkah li{ display:flex; gap:12px; position:relative; padding-bottom:16px; }
    .lk-langkah li::before{ content:""; position:absolute; left:13px; top:28px; bottom:0; width:2px; background:var(--border); }
    .lk-langkah li:last-child::before{ display:none; }
    .lk-langkah li.ya::before{ background:var(--green); }
    .lk-b{ width:28px; height:28px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:800; background:var(--surface2); color:var(--muted); border:2px solid var(--border); position:relative; z-index:1; }
    .lk-langkah li.ya .lk-b{ background:var(--green); border-color:var(--green); color:#fff; }
    .lk-langkah li.kini .lk-b{ box-shadow:0 0 0 5px color-mix(in srgb,var(--green) 22%,transparent); }
    .lk-l{ font-weight:700; font-size:14px; color:var(--text); padding-top:4px; }
    .lk-langkah li:not(.ya) .lk-l{ color:var(--muted); font-weight:600; }
    .lk-w{ font-size:12px; color:var(--muted); }
    .lk-tolak{ margin-top:6px; padding:12px 14px; border-radius:12px; background:var(--red-bg); color:var(--red); font-size:13.5px; }
    .lk-galat{ margin-top:16px; padding:14px; border-radius:14px; background:var(--red-bg); color:var(--red); font-size:13.5px; text-align:center; }
    .lk-kaki{ text-align:center; font-size:11.5px; color:var(--muted); margin-top:20px; }
    /* Menyesuaikan perangkat (lz-perangkat.js): layar sentuh dapat isian dan tombol lebih besar, huruf 16px agar iPhone tidak
       memperbesar sendiri; komputer dapat halaman lebih lebar dengan isian sebaris. */
        html[data-sentuh="ya"] .lk-form input{ height:50px; font-size:16px; }
    html[data-sentuh="ya"] .lk-form button{ height:50px; }
    html[data-sentuh="ya"] .lk-tema{ width:42px; height:42px; }
    html:is([data-perangkat="laptop"],[data-perangkat="desktop"]) .lk-wrap{ max-width:680px; padding-top:40px; }
    html:is([data-perangkat="laptop"],[data-perangkat="desktop"]) .lk-form{ grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) auto; align-items:end; }
    html:is([data-perangkat="laptop"],[data-perangkat="desktop"]) .lk-form button{ grid-column:auto; padding:0 22px; }
    html[data-perangkat="tablet"] .lk-wrap{ max-width:620px; }
    @media(max-width:480px){ .lk-form{ grid-template-columns:minmax(0,1fr); } .lk-head h1{ font-size:21px; } }
  </style>
</head>
<body>
  <script>
    (function(){ var t = null; try { t = localStorage.getItem('laz_theme'); } catch(e) {}
      if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t); })();
  </script>
  <script>LZLogo.muat({ kunci: 'lz_muat_lacak' });</script>
  <div class="lk-wrap">
    <div class="lk-atas-bar"><div class="lk-id"><div class="lk-logo lz-logo-kepala" id="lkLogo"><script>document.write(LZLogo.statis("Lazismu Bantul"));</script></div><div class="lk-lembaga" id="lkLembaga">Lazismu Daerah Bantul</div></div>
      <button type="button" class="lk-tema kepala-tema" data-lz-tema></button></div>
    <div class="lk-head"><h1>Lacak Progres</h1><p>Lihat progres pengajuan bantuan, sponsorship, proposal, atau surat Anda.</p></div>
    <div class="lk-muat hidden" id="lkMuat">Mencari pengajuan Anda...</div>
    <form class="lk-form" id="lkForm" autocomplete="off">
      <div><label for="lkNomor">Nomor pengajuan / surat</label><input id="lkNomor" placeholder="001/PB/X/2026" required></div>
      <div><label for="lkKode">Kode lacak</label><input id="lkKode" placeholder="6 huruf" maxlength="8" required></div>
      <button class="btn btn-primary" type="submit" id="lkCari">Lihat progres</button>
    </form>
    <div class="lk-hasil" id="lkHasil"></div>
    <button type="button" class="lk-lain hidden" id="lkLain">Cari pengajuan lain</button>
    <div class="lk-kaki">Nomor dan kode lacak ada di pesan dari petugas. Tautan yang dikirim petugas sudah terisi otomatis.</div>
  </div>
  <script>
    var BULAN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
    function $(id){ return document.getElementById(id); }
    function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
    function tgl(t){ if (!t) return ''; var d = new Date(t); if (isNaN(d)) { var p = String(t).split('-'); return p.length === 3 ? Number(p[2]) + ' ' + BULAN[Number(p[1]) - 1] + ' ' + p[0] : t; }
      return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' }); }
    function pasangLembaga(l){
      if (l.namaLembaga) $('lkLembaga').textContent = l.namaLembaga;
    }
    var q = new URLSearchParams(location.search);
    if (q.get('n')) $('lkNomor').value = q.get('n');
    if (q.get('k')) $('lkKode').value = q.get('k');
    if (!q.get('n') && window.LZ_PERANGKAT && /laptop|desktop/.test(LZ_PERANGKAT.kelas()) && LZ_PERANGKAT.sentuh() === 'tidak') $('lkNomor').focus();
    /* Tautan dari petugas sudah memuat nomor dan kode: isian disembunyikan, hasil langsung tampil. */
    var OTOMATIS = !!(q.get('n') && q.get('k'));
    if (OTOMATIS) { $('lkForm').classList.add('hidden'); $('lkMuat').classList.remove('hidden'); }
    $('lkLain').onclick = function(){ $('lkForm').classList.remove('hidden'); $('lkLain').classList.add('hidden'); $('lkHasil').innerHTML = ''; $('lkKode').value = ''; $('lkNomor').focus(); $('lkNomor').select(); };
    $('lkForm').onsubmit = function(e){
      e.preventDefault();
      var b = $('lkCari'); b.disabled = true; b.textContent = 'Mencari...';
      fetch('/api/media', { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ tindakan:'surat.lacak', data:{ nomor: $('lkNomor').value, kode: $('lkKode').value } }) })
        .then(function(r){ return r.json(); })
        .then(function(j){
          if (!j.ok) throw new Error(j.pesan || 'Tidak ditemukan');
          var p = j.pengajuan, kini = -1;
          p.langkah.forEach(function(l, i){ if (l.selesai) kini = i; });
          var h = '<div class="lk-kartu" id="lkKartu"><div class="lk-atas"><span class="lk-jenis">' + esc(p.jenisLabel) + '</span><span class="lk-nomor">' + esc(p.nomor) + '</span></div>'
            + '<div class="lk-perihal">' + esc(p.perihal) + '</div><div class="lk-tgl">Diterima ' + esc(tgl(p.tanggalTerima)) + '</div>'
            + '<div class="lk-status">Status sekarang: <b>' + esc(p.statusLabel) + '</b></div>'
            + (p.ditolak ? '<div class="lk-tolak">Mohon maaf, pengajuan ini belum dapat kami penuhi' + (p.waktuTolak ? ' (' + esc(tgl(p.waktuTolak)) + ')' : '') + '. Silakan hubungi kantor untuk keterangan lebih lanjut.</div>' : '')
            + '<ol class="lk-langkah">' + p.langkah.map(function(l, i){
                return '<li class="' + (l.selesai ? 'ya' : '') + (i === kini && !p.ditolak ? ' kini' : '') + '"><span class="lk-b">' + (l.selesai ? '&#10003;' : (i + 1)) + '</span>'
                  + '<div><div class="lk-l">' + esc(l.label) + '</div><div class="lk-w">' + esc(tgl(l.waktu)) + '</div></div></li>'; }).join('') + '</ol></div>';
          $('lkHasil').innerHTML = h;
          if (j.lembaga) pasangLembaga(j.lembaga);
          if (OTOMATIS) { $('lkLain').classList.remove('hidden'); }
        })
        .catch(function(err){ $('lkForm').classList.remove('hidden'); $('lkHasil').innerHTML = '<div class="lk-galat" id="lkGalat">' + esc(err.message) + '</div>'; })
        .then(function(){ b.disabled = false; b.textContent = 'Lihat progres'; $('lkMuat').classList.add('hidden'); });
    };
    if ($('lkNomor').value && $('lkKode').value) $('lkForm').requestSubmit();
  </script>
</body>
</html>
